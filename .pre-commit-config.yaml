# Hooks are run by prek (https://prek.j178.dev/), a drop-in replacement for pre-commit
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/Riverside-Healthcare/djLint
    rev: v1.46.3
    hooks:
      - id: djlint-reformat-django
      - id: djlint-django
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        language_version: python3.14
        args:
          - --line-length=88
          - --target-version=py314
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        language_version: python3
        exclude: /tests/
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: "0.12.21"
    hooks:
      - id: uv-lock
  - repo: local
    hooks:
      - id: deptry
        name: deptry
        description: Check for unused, missing or transitive dependencies
        entry: uv run deptry .
        language: system
        always_run: true
        pass_filenames: false
      - id: pip-licenses
        name: Check dependency licenses
        description: Fail if a dependency uses a copyleft license (GPL/AGPL/LGPL family); see [tool.pip-licenses] in pyproject.toml
        entry: uv run pip-licenses
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
